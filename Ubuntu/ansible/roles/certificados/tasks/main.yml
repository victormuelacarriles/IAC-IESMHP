#####################################CLAVES EXTERNAS
#TODO: actualizar desde GITHUB
- name: Comprobar si existe el fichero con claves externas
  stat:
    path: "{{ external_keys_file }}"
  register: external_keys_stat
- name: Leer claves del archivo externo (si existe)
  slurp:
    src: "{{ external_keys_file }}"
  register: external_keys_raw
  when: external_keys_stat.stat.exists
- name: Convertir claves externas en lista
  set_fact:
    # splitlines es un método de str, no un filtro de Jinja; se descartan líneas vacías y comentarios
    external_keys: "{{ (external_keys_raw.content | b64decode).splitlines() | map('trim') | reject('match', '^(#.*)?$') | list }}"
  when: external_keys_stat.stat.exists
- name: Añadir claves externas a authorized_keys si no están
  lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ item }}"
    state: present
    create: yes
    mode: '0600'
    owner: root
    group: root
  loop: "{{ external_keys }}"
  when: external_keys_stat.stat.exists
  ####################################################

# Limpia lo que dejaron las ejecuciones anteriores (claves repetidas y líneas vacías).
# Conserva el orden y la primera aparición de cada línea.
- name: Quitar líneas vacías y duplicadas de authorized_keys
  shell: |
    f=/root/.ssh/authorized_keys
    [ -f "$f" ] || exit 0
    t=$(mktemp)
    awk '{ sub(/[ \t\r]+$/, "") } NF && !visto[$0]++' "$f" > "$t"
    if ! cmp -s "$f" "$t"; then
      cat "$t" > "$f"
      echo CAMBIADO
    fi
    rm -f "$t"
  register: authorized_keys_limpieza
  changed_when: "'CAMBIADO' in authorized_keys_limpieza.stdout"
