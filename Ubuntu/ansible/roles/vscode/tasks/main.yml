---
# Instala VS Code o lo actualiza si la versión instalada es más vieja que la
# última estable publicada por Microsoft.

- name: Versión de VS Code instalada (dpkg)
  ansible.builtin.shell: dpkg-query -W -f='${Version}' code 2>/dev/null | cut -d- -f1
  register: code_dpkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: Consultar la última versión estable de VS Code
  ansible.builtin.uri:
    url: https://update.code.visualstudio.com/api/update/linux-deb-x64/stable/latest
    return_content: true
  register: code_latest
  failed_when: false
  check_mode: false

- name: Calcular si hay que instalar o actualizar
  ansible.builtin.set_fact:
    code_actual: "{{ code_dpkg.stdout | trim }}"
    code_ultima: "{{ code_latest.json.productVersion | default('') }}"
    code_url: "{{ code_latest.json.url | default('https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64') }}"
    code_sha256: "{{ code_latest.json.sha256hash | default('') }}"

- name: Decidir acción
  ansible.builtin.set_fact:
    # Sin instalar -> instalar. Instalado -> actualizar solo si conocemos la
    # última versión y es mayor que la instalada (si la API falla, no se toca).
    code_hay_que_instalar: >-
      {{ code_actual == '' or
         (code_ultima != '' and code_ultima is version(code_actual, '>')) }}

- name: Mostrar estado de VS Code
  ansible.builtin.debug:
    msg: >-
      VS Code instalado: {{ code_actual if code_actual else 'no' }} |
      última estable: {{ code_ultima if code_ultima else 'desconocida (API no accesible)' }} |
      acción: {{ ('instalar' if code_actual == '' else 'actualizar') if code_hay_que_instalar | bool else 'ninguna' }}

- name: Instalar / actualizar VS Code
  when: code_hay_que_instalar | bool
  block:
    # Copia de /etc/apt: el postinst del .deb añade el repo de Microsoft y
    # lo deshacemos al final para no romper el proxy apt del aula.
    - name: Copia de seguridad de los repositorios actuales
      ansible.builtin.shell: rm -rf /etc/apt.preVSCODE.bak && cp -a /etc/apt /etc/apt.preVSCODE.bak

    - name: Descargar el .deb de VS Code {{ code_ultima }}
      ansible.builtin.get_url:
        url: "{{ code_url }}"
        dest: /tmp/vscode_latest.deb
        mode: '0644'
        force: true
        checksum: "{{ ('sha256:' + code_sha256) if code_sha256 else omit }}"

    - name: Instalar el .deb de VS Code
      ansible.builtin.apt:
        deb: /tmp/vscode_latest.deb

  always:
    - name: Eliminar el .deb descargado
      ansible.builtin.file:
        path: /tmp/vscode_latest.deb
        state: absent

    - name: Restaurar los repositorios previos a VS Code
      ansible.builtin.shell: >-
        if [ -d /etc/apt.preVSCODE.bak ]; then
        rm -rf /etc/apt && cp -a /etc/apt.preVSCODE.bak /etc/apt; fi

    - name: Actualizar la caché de APT
      ansible.builtin.apt:
        update_cache: true

# ── Actualización automática diaria ──────────────────────────────────────────
# Timer que, {{ vscode_autoactualiza_espera }} después de encender (y cada
# {{ vscode_autoactualiza_intervalo }} si sigue encendido), vuelve a lanzar este
# rol en local; el script solo lo hace una vez al día.
# OJO: aquí NO se arranca el .service (state: started): cuando este rol lo lanza
# el propio service, esperaría a sí mismo y se quedaría bloqueado.

- name: Actualización automática de VS Code
  when: vscode_autoactualiza | bool
  block:
    - name: Instalar el script de actualización automática
      ansible.builtin.template:
        src: iac-actualiza-vscode.sh.j2
        dest: "{{ vscode_autoactualiza_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: Instalar las unidades service y timer
      ansible.builtin.template:
        src: "iac-actualiza-vscode.{{ item }}.j2"
        dest: "/etc/systemd/system/{{ vscode_autoactualiza_unidad }}.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]

    # Antes de arrancar el timer: si el equipo lleva más de
    # {{ vscode_autoactualiza_espera }} encendido, systemd lo dispara al momento y
    # lanzaría otro ansible en paralelo (p. ej. con roles.yaml en el primer
    # arranque). Con la marca de hoy, el script sale sin hacer nada.
    - name: Marcar que hoy ya se ha comprobado VS Code
      ansible.builtin.shell: >-
        mkdir -p "$(dirname {{ vscode_autoactualiza_marca }})" &&
        date +%F > {{ vscode_autoactualiza_marca }}
      changed_when: false

    - name: Habilitar y arrancar el timer
      ansible.builtin.systemd:
        name: "{{ vscode_autoactualiza_unidad }}.timer"
        enabled: true
        state: started
        daemon_reload: true

- name: Quitar la actualización automática de VS Code
  when: not (vscode_autoactualiza | bool)
  block:
    - name: Parar y deshabilitar el timer
      ansible.builtin.systemd:
        name: "{{ vscode_autoactualiza_unidad }}.timer"
        enabled: false
        state: stopped
      failed_when: false

    - name: Borrar script y unidades
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vscode_autoactualiza_script }}"
        - "/etc/systemd/system/{{ vscode_autoactualiza_unidad }}.service"
        - "/etc/systemd/system/{{ vscode_autoactualiza_unidad }}.timer"

    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: true
