#Primera versión terminada (básica: instala y punto)

#Por hacer:   1- mas elegante la detección de instalación (da error si no está instalado y queda feo)
#             2- Arreglar redes virtuales (parámetros para crear, crear una por usuario)
#             0 - Definir una carpeta comun desde donde descargar el bundle (o no hacer proceso si no está) 


- name: Comprobar si VMware está instalado
  shell: vmware --version
  register: vmware_check
  failed_when: false    # rc=127 si no está instalado: es lo esperado, no un error
  changed_when: false

- name: Extraer versión instalada de VMware
  set_fact:
    vmware_installed_version: "{{ vmware_check.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  when: vmware_check.rc == 0

- name: Mostrar versión instalada de VMware
  debug:
    msg: "VMware Workstation instalado: {{ vmware_installed_version | default('ninguna') }}"

- name: Copiamos el fichero .bundle al equipo remoto
  copy:
    src: "{{ vmware_bundle_path }}"
    dest: "/tmp/VMware-Workstation.bundle"
    remote_src: true  # Use true if the file is already on the remote machine
  when: (vmware_installed_version is not defined or vmware_installed_version != vmware_version) 

- name: Hacer ejecutable el instalador .bundle
  file:
    path: "/tmp/VMware-Workstation.bundle"
    mode: '0755'
  when: vmware_installed_version is not defined or vmware_installed_version != vmware_version

- name: Ejecutar instalador de VMware
  command: "/tmp/VMware-Workstation.bundle --eulas-agreed --required --console"
  when: vmware_installed_version is not defined or vmware_installed_version != vmware_version

- name: Ejecutar post-instalación de VMware(1/2) (helper)
  command: "/usr/lib/vmware/bin/vmware-setup-helper -e -o -u no -c no"
  when: vmware_installed_version is not defined or vmware_installed_version != vmware_version

# ─────────────────────────────────────────────────────────────────────────────
# Módulos vmmon/vmnet: VMware NUNCA debe pedir "Kernel Module Updater" (2026-10-06).
# En el primer arranque, 3-SetupPrimerInicio.sh hace full-upgrade (kernel NUEVO)
# y Ansible corre SIN reiniciar: compilar solo para ansible_kernel (el viejo)
# hacía que, al arrancar con el nuevo, VMware pidiera compilar con sudo.
# Solución (VMware no usa DKMS):
#   1. cabeceras de TODOS los kernels instalados + linux-headers-generic;
#   2. compilar para TODOS los kernels (iac-vmware-modulos.sh, sin GUI);
#   3. hooks /etc/kernel/{postinst.d,header_postinst.d}/zz-iac-vmware para los
#      kernels que lleguen en el futuro;
#   4. iac-vmware-modulos.service: red de seguridad en cada arranque.
# Todo esto se ejecuta SIEMPRE (idempotente): re-lanzar el rol arregla equipos
# ya instalados (ansible-playbook ... --tags vmware).
# ─────────────────────────────────────────────────────────────────────────────
# libaio1t64 evita el aviso "An up-to-date libaio ... is preferred";
# xvfb/xauth solo para el respaldo con vmware-modconfig (necesita pantalla).
- name: Instalar dependencias de compilación de los módulos de VMware
  apt:
    name:
      - xvfb
      - xauth
      - libaio1t64
      - build-essential
      - linux-headers-generic
    state: present
    update_cache: false

- name: Instalar las cabeceras de TODOS los kernels instalados
  shell: |
    for k in $(ls /lib/modules); do
      [ -d "/lib/modules/$k/build" ] && continue
      apt-get install -y "linux-headers-$k" </dev/null && echo "instaladas: $k" || echo "no disponibles: $k"
    done
  register: vmware_headers
  changed_when: "'instaladas:' in vmware_headers.stdout"

# libaio1t64 (Ubuntu 24.04+) solo trae libaio.so.1t64; el AppLoader de VMware
# busca libaio.so.1 y, si no lo ve, avisa "Use shipped Linux kernel AIO access
# library". Con el enlace usa la del sistema (el aviso NO es la causa del fallo).
- name: Enlazar libaio.so.1 -> libaio.so.1t64 (para el AppLoader de VMware)
  file:
    src: /usr/lib/x86_64-linux-gnu/libaio.so.1t64
    dest: /usr/lib/x86_64-linux-gnu/libaio.so.1
    state: link
    force: false
  failed_when: false

- name: Instalar script de compilación de módulos (iac-vmware-modulos.sh)
  copy:
    src: iac-vmware-modulos.sh
    dest: /usr/local/sbin/iac-vmware-modulos.sh
    mode: '0755'

- name: Crear directorios de hooks de kernel
  file:
    path: "/etc/kernel/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - postinst.d
    - header_postinst.d

- name: Instalar hooks de kernel (kernels futuros)
  copy:
    src: zz-iac-vmware
    dest: "/etc/kernel/{{ item }}/zz-iac-vmware"
    mode: '0755'
  loop:
    - postinst.d
    - header_postinst.d

- name: Instalar servicio de comprobación en cada arranque
  copy:
    src: iac-vmware-modulos.service
    dest: /etc/systemd/system/iac-vmware-modulos.service
    mode: '0644'

- name: Habilitar iac-vmware-modulos.service
  systemd:
    name: iac-vmware-modulos.service
    enabled: true
    daemon_reload: true

- name: Compilar vmmon/vmnet para TODOS los kernels instalados
  command: /usr/local/sbin/iac-vmware-modulos.sh
  register: vmware_modulos
  changed_when: "'compilado e instalado' in vmware_modulos.stdout"
  failed_when: false

- name: Resultado de la compilación de módulos (log en /var/log/IAC-IESMHP/Ubuntu/vmware-modulos.log)
  debug:
    var: vmware_modulos.stdout_lines

# Comprobación final: VMware solo funciona si vmmon y vmnet están cargados.
# Si están compilados pero no cargan, lo habitual es Secure Boot (módulos sin firmar).
- name: Comprobación final - módulos vmmon/vmnet cargados
  shell: |
    modprobe vmmon && modprobe vmnet; rc=$?
    lsmod | grep -E '^(vmmon|vmnet) '
    mokutil --sb-state 2>/dev/null
    # Módulos presentes para CADA kernel instalado (el del próximo arranque incluido)
    for k in $(ls /lib/modules); do
      if modinfo -k "$k" vmmon >/dev/null 2>&1 && modinfo -k "$k" vmnet >/dev/null 2>&1; then
        echo "kernel $k: vmmon/vmnet OK"
      else
        echo "kernel $k: FALTAN vmmon/vmnet"; rc=1
      fi
    done
    exit $rc
  register: vmware_final
  changed_when: false
  failed_when: false

- name: Resultado de la comprobación final de VMware
  debug:
    msg: "{{ 'OK: vmmon y vmnet cargados' if vmware_final.rc == 0 else 'ERROR: módulos de VMware NO cargados' }} | {{ vmware_final.stdout_lines + vmware_final.stderr_lines }}"
