---
# ------------------------------------------------------------------ plantilla
# Plantilla de la máquina virtual = <raíz> / <ruta>. Tiene que haber un único
# .vmx dentro. En el NAS (montado por el rol clienteNAS):
#   /mnt/nasDepInfo/PruebaRapidosX3/SMRV/VMWARE-Plantillas/Win11
VirtualW11_nas_raiz: /mnt/nasDepInfo/PruebaRapidosX3
VirtualW11_plantilla_ruta: SMRV/VMWARE-Plantillas/Win11

# Caché local de la plantilla en cada equipo (parte 1: CacheNAS.yaml, como
# root con el inventario de aula): <disco>/<carpeta>/<ruta>, en el primer disco
# de la lista que exista → /datos/nasCache/SMRV/VMWARE-Plantillas/Win11 o
# /home/nasCache/SMRV/VMWARE-Plantillas/Win11.
VirtualW11_cache_discos: [/datos, /home]
VirtualW11_cache_carpeta: nasCache

# Segundos máximos para la copia NAS → caché (~15 GB la primera vez).
VirtualW11_timeout_cache: 7200

# Origen fijo de la plantilla (vacío = automático: el primero que la tenga de
# /datos/nasCache, /home/nasCache y el NAS).
VirtualW11_origen: ""

# Carpeta de las máquinas virtuales dentro del HOME del usuario. La máquina
# queda en ~/<VirtualW11_carpeta>/<VirtualW11_prefijo>-<usuario>.
VirtualW11_carpeta: vmware
VirtualW11_prefijo: Win11


# Espacio libre que debe quedar en el HOME después de copiar (GB).
VirtualW11_margen_gb: 5

# Tiempo máximo de la copia (segundos). Se hace en segundo plano (async) para
# que la conexión SSH no se corte durante los ~15 GB.
VirtualW11_timeout_copia: 7200

# true = BORRA la máquina del usuario y la vuelve a copiar de la plantilla
# (pierde todo lo que haya hecho el alumno). Solo con -e, nunca aquí.
VirtualW11_reemplazar: false

# ---------------------------------------------------------- comprobar arranque
# Arranca la máquina sin ventana (vmrun ... nogui), espera a que respondan las
# VMware Tools del Windows invitado y muestra lo que devuelven.
VirtualW11_comprobar_arranque: true

# Segundos máximos esperando a que las VMware Tools respondan. Normalmente
# tardan 15-20 s, pero a veces Windows tarda muchos minutos en arrancar el
# servicio de las Tools (visto 6, 7 y más de 10 min; causa sin aclarar).
VirtualW11_timeout_tools: 1200

# Apagar la máquina al terminar la comprobación (solo si la ha encendido el
# rol; si ya estaba encendida, no se apaga nunca).
VirtualW11_apagar_tras_comprobar: true

# Segundos para el apagado ordenado (soft) antes de forzarlo (hard).
VirtualW11_timeout_apagado: 180

# ------------------------------------------------------------------- red
# Modo de red de la única tarjeta (ethernet0), que se fija antes de encender:
#  - nat (por defecto): red vmnet8 del equipo físico. IP fija <subred>.(100+N)
#    si el usuario acaba en número N (SMRV02 → .102); si no, la del DHCP, fija.
#  - bridged: red del aula. IP fija = IP del equipo físico + VirtualW11_ip_suma.
VirtualW11_red: nat

# ------------------------------------------------- configuración del invitado
# Tras comprobar las Tools: administrador, SSH, IP estática y nombre.
VirtualW11_configurar_invitado: true

# Cada alumno tiene dos usuarios en Windows, con la MISMA contraseña (esta, al
# crearlos): <usuario físico> (SMRV08, vmuela...) ESTÁNDAR, con arranque
# automático y Remmina, y <prefijo><usuario> (adminSMRV08) ADMINISTRADOR, que
# es el que usa el rol (las operaciones de vmrun en el invitado necesitan
# usuario y contraseña de Windows). El de la plantilla queda desactivado.
VirtualW11_invitado_password: "usuario@1"
VirtualW11_admin_prefijo: admin

# Usuario de la plantilla: solo se usa para entrar la primera vez (y crear el
# administrador nuevo); después queda desactivado.
VirtualW11_invitado_usuario: usuario

# Solo con VirtualW11_red=bridged: IP estática del invitado = IP del equipo
# físico + este número (último octeto). Si pasa de 254, o la IP responde a
# ping, se queda en DHCP.
VirtualW11_ip_suma: 30

# Segundos máximos esperando a que vuelva tras reiniciar (cambio de nombre).
VirtualW11_timeout_reinicio: 600

# Lanzador RDP en Remmina (perfil con usuario e IP, sin contraseña) y
# Escritorio remoto activado en el invitado.
VirtualW11_remmina: true

# Arranque automático (autologon) del usuario estándar con la contraseña inicial
# y acceso directo en el escritorio para cambiarla (CambiarPassword.ps1). Si el
# alumno ya cambió la contraseña, no se toca su arranque automático.
VirtualW11_autologon_activar: true
