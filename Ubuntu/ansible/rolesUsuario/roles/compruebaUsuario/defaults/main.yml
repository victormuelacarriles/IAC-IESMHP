---
# Dominio que se añade a la variable `usuario` del inventario (formato IABD:
# usuario=CEGSIABD14). Si el host trae ya ansible_user=SMRV08@iesmhp.local
# (formato SMRD) se usa tal cual.
compruebaUsuario_dominio: iesmhp.local

# Segundos de espera de la conexión SSH (ConnectTimeout).
compruebaUsuario_timeout: 5

# Contraseña para entrar (vacía = con clave SSH). Si se usa, pasarla con -e o
# desde un vault, nunca escrita aquí. Necesita el paquete sshpass.
compruebaUsuario_password: ""
