---
# compruebaUsuario — ¿puede entrar por SSH el usuario asignado a cada equipo?
#
# Resultado por equipo (y en el PLAY RECAP):
#   OK          → entra como el usuario                       → ok
#   NO ACCEDE   → el equipo responde, pero el usuario no entra → failed
#                 (no existe, no tiene la clave/contraseña o falla el dominio)
#   APAGADO     → el equipo no responde en el puerto 22        → failed
#
# El ssh se lanza DESDE EL CONTROLADOR (delegate_to: localhost) y se lee su
# salida: así un login rechazado es un fallo normal de la tarea y no un
# "UNREACHABLE ... ignoring" de Ansible. En el equipo solo se ejecuta `id -un`.

- name: Usuario a comprobar en {{ inventory_hostname }}
  ansible.builtin.set_fact:
    compruebaUsuario_usuario: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    compruebaUsuario_ip: "{{ ansible_host | default(inventory_hostname) }}"
  tags: [compruebaUsuario]

- name: Entrar como {{ compruebaUsuario_usuario }} en {{ compruebaUsuario_ip }}
  ansible.builtin.command:
    argv: >-
      {{ (['sshpass', '-e'] if compruebaUsuario_password | length > 0 else [])
         + ['ssh',
            '-o', 'BatchMode=' ~ ('no' if compruebaUsuario_password | length > 0 else 'yes'),
            '-o', 'StrictHostKeyChecking=accept-new',
            '-o', 'ConnectTimeout=' ~ compruebaUsuario_timeout,
            '-l', compruebaUsuario_usuario,
            compruebaUsuario_ip, 'id -un'] }}
  environment:
    SSHPASS: "{{ compruebaUsuario_password }}"
  delegate_to: localhost
  register: compruebaUsuario_login
  failed_when: false
  changed_when: false
  tags: [compruebaUsuario]

# stderr con default: alguna vez (2026-10-26, prueba local) el resultado llegó
# sin stderr y el set_fact rompía. sshpass con contraseña mala sale con rc=5 y
# sin mensaje: es NO ACCEDE, no APAGADO.
- name: Resultado
  ansible.builtin.set_fact:
    compruebaUsuario_login: >-
      {{ compruebaUsuario_login | combine({
           'rc': compruebaUsuario_login.rc | default(-1),
           'stderr': compruebaUsuario_login.stderr | default(compruebaUsuario_login.msg | default('')) | string
                     ~ (' (sshpass: contraseña incorrecta)' if compruebaUsuario_password | length > 0
                        and (compruebaUsuario_login.rc | default(-1)) == 5 else '') }) }}
    compruebaUsuario_estado: >-
      {%- set rc = compruebaUsuario_login.rc | default(-1) -%}
      {%- set err = compruebaUsuario_login.stderr | default(compruebaUsuario_login.msg | default('')) | string -%}
      {%- if rc == 0 -%}OK
      {%- elif err is search('Permission denied|Too many authentication|Authentication failed')
               or (compruebaUsuario_password | length > 0 and rc == 5) -%}NO ACCEDE
      {%- else -%}APAGADO
      {%- endif -%}
  tags: [compruebaUsuario]

- name: Resumen
  ansible.builtin.debug:
    msg: >-
      {{ '%-9s' | format(hostvars[item].compruebaUsuario_estado | default('?')) }}
      {{ item }} ({{ hostvars[item].compruebaUsuario_ip | default(item) }})
      {{ hostvars[item].compruebaUsuario_usuario | default('?') }}
  loop: "{{ ansible_play_hosts_all | sort }}"
  loop_control:
    label: "{{ item }}"
  run_once: true
  tags: [compruebaUsuario]

# Va al final para que el resumen salga completo: un equipo que falla aquí
# deja de procesarse y cuenta como "failed" en el PLAY RECAP.
- name: Comprobar que el usuario entra
  ansible.builtin.fail:
    msg: >-
      {{ compruebaUsuario_estado }} → {{ compruebaUsuario_login.stderr | trim | regex_replace('\s+', ' ') }}
  when: compruebaUsuario_estado != 'OK'
  tags: [compruebaUsuario]
