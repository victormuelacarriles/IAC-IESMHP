---
# ===========================================================================
# rolesUsuario.yaml — Playbook de configuración POR USUARIO
# ---------------------------------------------------------------------------
# A diferencia de ../roles.yaml (que corre COMO ROOT sobre el equipo), este
# playbook trabaja con el USUARIO de cada equipo (become: no global).
#
# Uso remoto (desde el servidor de Ansible, con un inventario de alumnos):
#   cd /opt/IAC-IESMHP/Ubuntu/ansible/rolesUsuario
#   ansible-playbook -i EquiposSMRD-alumnos2627.ini rolesUsuario.yaml
#   ansible-playbook -i equiposIABD-alumnos2627.ini rolesUsuario.yaml
#   (añadir -k si se entra con contraseña en vez de con clave; necesita sshpass)
#
# Uso local (como el usuario, NO como root):
#   ansible-playbook -i localhost, --connection=local rolesUsuario.yaml
#
# Limitar a un rol concreto:  --tags <rol>      Limitar a un equipo:  -l <host>
#
# 2026-10-21: se eliminó el rol DockerRootless (lo hace ya ../roles/Docker).
# 2026-10-22: hosts: all (antes localhost) para poder usar los inventarios de
#             alumnos; primer rol: compruebaUsuario.
# ===========================================================================

- name: Configuración del perfil de usuario
  hosts: all
  become: no
  gather_facts: no

  roles:
    - role: compruebaUsuario
      tags: [compruebaUsuario]
