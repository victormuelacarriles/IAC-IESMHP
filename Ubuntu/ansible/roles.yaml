---
#Puedes ver ejemplos de uso en /opt/IAC-IESMHP/Ubuntu/ansible/utilesGesionAula

- hosts: all
  become: yes

  pre_tasks:
    - name: Actualizar cache apt (para no hacerlo en cada rol)
      apt:
        update_cache: yes
      tags: always    #se ejecuta también al lanzar un solo rol con --tags
  roles:
     - { role: basicos, tags: basicos } #cosas que debieras estar desde el livecd pero que recomprobamos #[python, pip, pipx, ansible]
     - { role: horaHTTP, tags: horaHTTP } #Sincroniza la hora en CADA arranque (NTP y, si está filtrado el UDP 123, fallback HTTP). service+timer. Ver roles/horaHTTP/CLAUDE.md
     - { role: nvidia, tags: nvidia }
     - { role: flatpak, tags: flatpak } #Instala el soporte de flatpak y el repositorio de Flathub
     # Para añadir nuevas aulas: editar roles/comparteaula/defaults/main.yml
     - { role: certificados, tags: certificados }
     - { role: obs, tags: obs }
     - { role: rdp, tags: rdp } # Servidor RDP nativo de GNOME (Ubuntu 26.04). Antes era el rol comentado #- xrdp
     - { role: vscode, tags: vscode }
     - { role: clienteNAS, tags: clienteNAS } #Cliente NFS del NAS del DEPARTAMENTO: 
                      #autodescubre exports y los monta RO en /mnt/nasDepInfo (ver roles/clienteNAS/CLAUDE.md)
     - { role: DirtyFrag, tags: DirtyFrag } #Evalua y mitiga la vuln. "Dirty Frag" (CVE-2026-43284 ESP/IPsec + CVE-2026-43500 RxRPC): bloquea esp4/esp6/rxrpc
     - { role: Docker, tags: Docker } #Docker ROOTLESS para todos los usuarios (locales y dominio): sistema + autoconfiguración por usuario en cada login (hook PAM + servicio de usuario)
     - { role: preparaAD, tags: preparaAD } #Prerequisitos para unión a dominio Active Directory (realmd+SSSD+adcli). NO une al dominio: ver roles/preparaAD/CLAUDE.md
     # vmware SIEMPRE el ÚLTIMO: compila vmmon/vmnet para TODOS los kernels instalados (incluido
     # el que trae el full-upgrade del primer arranque) y deja hooks de kernel + servicio de arranque
     # para que VMware NUNCA pida "Kernel Module Updater". Ver roles/vmware/CLAUDE.md
     - { role: vmware, tags: vmware }


#POR HACER:
#      - apt cache [tirando de cabina si la tiene a tiro. Como está configurado en 10.0.72.140]
#      - hashicorp     #[terraform, packer]





